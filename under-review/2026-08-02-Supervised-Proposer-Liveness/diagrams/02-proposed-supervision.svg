<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="665px" preserveAspectRatio="none" style="width:805px;height:665px;background:#FFFFFF;" version="1.1" viewBox="0 0 805 665" width="805px" zoomAndPan="magnify"><?plantuml $version$?><defs/><g><g class="entity" data-qualified-name="Starting" data-source-line="12" id="ent0001"><rect fill="#D7EAF8" height="77.2038" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="223.2372" x="52.07" y="87"/><line style="stroke:#334155;stroke-width:0.5;" x1="52.07" x2="275.3072" y1="116.0679" y2="116.0679"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.3038" x="137.5367" y="106.9659">Starting</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.6976" x="57.07" y="136.0339">isReady = false</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203.2372" x="57.07" y="155.1018">parent owns every critical child</text></g><g class="entity" data-qualified-name="Ready" data-source-line="13" id="ent0002"><rect fill="#BEE5CF" height="96.2717" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="226.4292" x="395.48" y="261.21"/><line style="stroke:#334155;stroke-width:0.5;" x1="395.48" x2="621.9092" y1="290.2779" y2="290.2779"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="40.2078" x="488.5907" y="281.1759">Ready</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.1976" x="400.48" y="310.2439">isReady = true</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206.4292" x="400.48" y="329.3118">validator implies proposer alive</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.9654" x="400.48" y="348.3797">and request queue open</text></g><g class="entity" data-qualified-name="Stopping" data-source-line="14" id="ent0003"><rect fill="#FFF0A8" height="77.2038" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="208.3273" x="582.53" y="464.01"/><line style="stroke:#334155;stroke-width:0.5;" x1="582.53" x2="790.8573" y1="493.0779" y2="493.0779"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="59.3038" x="657.0417" y="483.9759">Stopping</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.3273" x="587.53" y="513.0439">publish planned cancellation</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.6976" x="587.53" y="532.1118">isReady = false</text></g><g class="entity" data-qualified-name="Failed" data-source-line="15" id="ent0004"><rect fill="#F7C7C7" height="96.2717" rx="12.5" ry="12.5" style="stroke:#334155;stroke-width:0.5;" width="255.3811" x="7" y="454.48"/><line style="stroke:#334155;stroke-width:0.5;" x1="7" x2="262.3811" y1="483.5479" y2="483.5479"/><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.8499" x="115.2656" y="474.4459">Failed</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.6513" x="12" y="503.5139">atomically set isReady = false</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="235.3811" x="12" y="522.5818">record bounded diagnostic + metric</text><text fill="#0F172A" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.9435" x="12" y="541.6497">cancel sibling tasks</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="17" id="ent0005"><ellipse cx="163.69" cy="16" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g 